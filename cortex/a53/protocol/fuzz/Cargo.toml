[package]
name = "hft-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.10"
libfuzzer-sys = "0.4"
hft-protocol = { path = ".." }
tokio-util = { version = "0.7", features = ["codec"] }

[[bin]]
name = "mold_and_soup"
path = "fuzz_targets/mold_and_soup.rs"
test = false
doc = false
bench = false

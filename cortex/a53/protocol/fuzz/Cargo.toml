[package]
name = "hft-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Keeps this crate out of the parent workspace. The root manifest's `exclude`
# does not do it: this directory is inside the member cortex/a53/protocol, and
# cargo counts a path under a member as part of that member, so cargo refused
# to build the fuzz crate at all.
[workspace]

[dependencies]
bytes = "1.10"
libfuzzer-sys = "0.4"
hft-protocol = { path = ".." }
tokio-util = { version = "0.7", features = ["codec"] }

[[bin]]
name = "mold_and_soup"
path = "fuzz_targets/mold_and_soup.rs"
test = false
doc = false
bench = false

name: Yocto image

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            yocto/downloads
            yocto/sstate-cache
          key: yocto-scarthgap-${{ hashFiles('yocto/kas/myd-czu5ev-v2.yml', 'yocto/**/*.bb*') }}
          restore-keys: yocto-scarthgap-
      - name: Build Yocto container
        run: docker build -t hft-yocto -f containers/yocto/Dockerfile .
      # bitbake runs as the image's "builder" user (UID 1000), which must be
      # able to create build/ and write the restored caches.
      - name: Hand the workspace to the build user
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      - name: Validate layers and parse recipes
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            hft-yocto \
            kas shell yocto/kas/myd-czu5ev-v2.yml \
              -c 'bitbake-layers show-layers && bitbake -p hft-image'
      - name: Build image, SPDX, and SWUpdate artifacts
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            hft-yocto \
            kas build yocto/kas/myd-czu5ev-v2.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: myd-czu5ev-v2-yocto-artifacts
          path: |
            build/tmp/deploy/images/hft-myd-czu5ev-v2/*.wic*
            build/tmp/deploy/images/hft-myd-czu5ev-v2/*.swu
            build/tmp/deploy/spdx/
          if-no-files-found: warn

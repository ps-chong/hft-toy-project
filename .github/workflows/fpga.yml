name: FPGA

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ghdl:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install simulator and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl
          python -m pip install -e 'python[dev]'
      - name: Verify generated contracts
        run: python protocol/generator/generate.py --check
      - name: Lint synthesizable VHDL and tests
        run: vsg -c fpga/vsg.yaml -f fpga/rtl/*.vhd fpga/tb/*.vhd
      - name: Run VUnit suite with GHDL
        env:
          VUNIT_SIMULATOR: ghdl
        run: python fpga/sim/run.py -x fpga-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fpga-ghdl-results
          path: |
            fpga-junit.xml
            vunit_out/test_output/**/output.txt

  nvc-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - name: Install pinned NVC
        run: |
          curl -sL -o /tmp/nvc.deb \
            https://github.com/nickg/nvc/releases/download/r1.23.0/nvc_1.23.0-1_amd64_ubuntu-24.04.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/nvc.deb
          nvc --version
      - name: Install VUnit
        run: python -m pip install -e 'python[dev]'
      - name: Run statement, branch, and functional coverage
        env:
          VUNIT_SIMULATOR: nvc
          HFT_VHDL_COVERAGE: "1"
        run: python fpga/sim/run.py -x fpga-nvc-junit.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fpga-nvc-coverage
          path: |
            fpga-nvc-junit.xml
            coverage-reports/vhdl/

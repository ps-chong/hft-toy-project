name: Python and documentation

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install tools
        run: |
          python -m pip install -e 'python[dev]'
          npm install --global @mermaid-js/mermaid-cli@11.12.0
      - name: Ruff
        run: ruff check python scripts protocol/generator coverage deploy/swupdate
      - name: Mypy
        run: mypy --config-file python/pyproject.toml python/src/hft_tools
      - name: Pytest and coverage
        run: |
          mkdir -p coverage-reports/python
          pytest python/tests \
            --cov=hft_tools --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage-reports/python/coverage.xml
      - name: Render and verify architecture diagrams
        run: |
          python scripts/render_diagrams.py --render
          git diff --exit-code -- docs/architecture/diagrams
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: python-docs-results
          path: |
            coverage-reports/python/
            docs/architecture/diagrams/*.svg

{
  "name": "HFT FPGA UDP telemetry",
  "version": 2,
  "byte_order": "big",
  "ether_type": "0x0800",
  "ip_protocol": 17,
  "default_source_port": 47000,
  "default_destination_port": 47001,
  "payload_size": 64,
  "fields": [
    {"name": "abi_version", "offset": 0, "size": 2, "type": "u16"},
    {"name": "record_type", "offset": 2, "size": 1, "type": "u8", "value": 1},
    {"name": "event_kind", "offset": 3, "size": 1, "type": "u8"},
    {"name": "event_side", "offset": 4, "size": 1, "type": "u8"},
    {"name": "status_flags", "offset": 5, "size": 1, "type": "u8"},
    {"name": "reserved0", "offset": 6, "size": 2, "type": "bytes"},
    {"name": "sequence", "offset": 8, "size": 8, "type": "u64"},
    {"name": "timestamp_ns", "offset": 16, "size": 8, "type": "u64"},
    {"name": "order_reference", "offset": 24, "size": 8, "type": "u64"},
    {"name": "symbol", "offset": 32, "size": 8, "type": "ascii"},
    {"name": "price", "offset": 40, "size": 8, "type": "u64"},
    {"name": "quantity", "offset": 48, "size": 4, "type": "u32"},
    {"name": "rx_dropped", "offset": 52, "size": 4, "type": "u32"},
    {"name": "ingress_cycles", "offset": 56, "size": 8, "type": "u64", "description": "axis_clk cycle counter latched at the frame start of the source packet"}
  ]
}

{
  "name": "Nasdaq TotalView-ITCH",
  "version": "5.0",
  "byte_order": "big",
  "common_prefix": [
    {"name": "message_type", "offset": 0, "size": 1, "type": "ascii"},
    {"name": "stock_locate", "offset": 1, "size": 2, "type": "u16"},
    {"name": "tracking_number", "offset": 3, "size": 2, "type": "u16"},
    {"name": "timestamp", "offset": 5, "size": 6, "type": "u48"}
  ],
  "messages": [
    {
      "name": "system_event",
      "type": "S",
      "length": 12,
      "fields": [
        {"name": "event_code", "offset": 11, "size": 1, "type": "ascii"}
      ]
    },
    {"name": "stock_directory", "type": "R", "length": 39},
    {
      "name": "add_order",
      "type": "A",
      "length": 36,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "side", "offset": 19, "size": 1, "type": "ascii"},
        {"name": "shares", "offset": 20, "size": 4, "type": "u32"},
        {"name": "stock", "offset": 24, "size": 8, "type": "ascii"},
        {"name": "price", "offset": 32, "size": 4, "type": "u32"}
      ]
    },
    {
      "name": "add_order_mpid",
      "type": "F",
      "length": 40,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "side", "offset": 19, "size": 1, "type": "ascii"},
        {"name": "shares", "offset": 20, "size": 4, "type": "u32"},
        {"name": "stock", "offset": 24, "size": 8, "type": "ascii"},
        {"name": "price", "offset": 32, "size": 4, "type": "u32"},
        {"name": "attribution", "offset": 36, "size": 4, "type": "ascii"}
      ]
    },
    {
      "name": "order_executed",
      "type": "E",
      "length": 31,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "executed_shares", "offset": 19, "size": 4, "type": "u32"},
        {"name": "match_number", "offset": 23, "size": 8, "type": "u64"}
      ]
    },
    {
      "name": "order_executed_with_price",
      "type": "C",
      "length": 36,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "executed_shares", "offset": 19, "size": 4, "type": "u32"},
        {"name": "match_number", "offset": 23, "size": 8, "type": "u64"},
        {"name": "printable", "offset": 31, "size": 1, "type": "ascii"},
        {"name": "execution_price", "offset": 32, "size": 4, "type": "u32"}
      ]
    },
    {
      "name": "order_cancel",
      "type": "X",
      "length": 23,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "cancelled_shares", "offset": 19, "size": 4, "type": "u32"}
      ]
    },
    {
      "name": "order_delete",
      "type": "D",
      "length": 19,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"}
      ]
    },
    {
      "name": "order_replace",
      "type": "U",
      "length": 35,
      "fields": [
        {"name": "original_order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "new_order_reference", "offset": 19, "size": 8, "type": "u64"},
        {"name": "shares", "offset": 27, "size": 4, "type": "u32"},
        {"name": "price", "offset": 31, "size": 4, "type": "u32"}
      ]
    },
    {
      "name": "trade",
      "type": "P",
      "length": 44,
      "fields": [
        {"name": "order_reference", "offset": 11, "size": 8, "type": "u64"},
        {"name": "side", "offset": 19, "size": 1, "type": "ascii"},
        {"name": "shares", "offset": 20, "size": 4, "type": "u32"},
        {"name": "stock", "offset": 24, "size": 8, "type": "ascii"},
        {"name": "price", "offset": 32, "size": 4, "type": "u32"},
        {"name": "match_number", "offset": 36, "size": 8, "type": "u64"}
      ]
    },
    {"name": "cross_trade", "type": "Q", "length": 40}
  ],
  "fail_closed_on": [
    "truncated_message",
    "length_mismatch",
    "sequence_gap",
    "book_capacity_exceeded"
  ]
}

BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "hft"
BBFILE_PATTERN_hft = "^${LAYERDIR}/"
BBFILE_PRIORITY_hft = "20"

LAYERSERIES_COMPAT_hft = "scarthgap"
# meta-python provides python3-protobuf, python3-coloredlogs and python3-sympy
# for the vendored ONNX recipes (recipes-ml).
LAYERDEPENDS_hft = "core xilinx xilinx-bsp openembedded-layer meta-python rust-bin-layer swupdate openamp-layer"

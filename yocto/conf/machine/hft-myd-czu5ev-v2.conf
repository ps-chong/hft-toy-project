#@TYPE: Machine
#@NAME: HFT MYD-CZU5EV-V2
#@DESCRIPTION: MYD-CZU5EV-V2 A53 Linux plus deferred R5-0 FreeRTOS configuration

require conf/machine/zynqmp-generic.conf

MACHINEOVERRIDES =. "hft-myd-czu5ev-v2:"
MACHINE_FEATURES:append = " mali400 vcu openamp fpga-overlay"

# Enabling the R5 multiconfig requires an MYIR-generated SDT/XSA machine.
HFT_ENABLE_R5_MULTICONFIG ?= "0"
BBMULTICONFIG += "${@'hft-myd-czu5ev-v2-cortexr5-0-freertos' if d.getVar('HFT_ENABLE_R5_MULTICONFIG') == '1' else ''}"

# The board fragment (recipes-bsp/device-tree/files/hft-myd-czu5ev-v2.dtsi)
# is merged into the system device tree by the device-tree recipe; the kernel
# tree has no overlay source to build.
IMAGE_FSTYPES:append = " wic wic.bmap"
WKS_FILE = "hft-myd-czu5ev-v2-ab.wks.in"

# Reserved for hardware bring-up: nothing in this layer reads these three yet.
# The R5 firmware and the bitstream are not packaged into the image, and
# HFT_HARDWARE_VALIDATED is meant to become a build-time gate once a board has
# run the image.
HFT_R5_FIRMWARE ?= "hft-r5.elf"
HFT_PL_BITSTREAM ?= "myd_czu5ev_v2_hft.bit"
HFT_HARDWARE_VALIDATED ?= "0"

# boot_slot, upgrade_available, bootcount and bootlimit are U-Boot environment
# variables (see docs/architecture/boot-update.md). UBOOT_ENV is something
# else: the base name of an environment script file to install, so listing the
# variables there made u-boot-xlnx look for a file called
# "boot_slot upgrade_available bootcount bootlimit.txt".
KERNEL_MODULE_AUTOLOAD:append = " zynqmp_r5_remoteproc rpmsg_char"

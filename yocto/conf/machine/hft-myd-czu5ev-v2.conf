#@TYPE: Machine
#@NAME: HFT MYD-CZU5EV-V2
#@DESCRIPTION: MYD-CZU5EV-V2 A53 Linux plus deferred R5-0 FreeRTOS configuration

require conf/machine/zynqmp-generic.conf

MACHINEOVERRIDES =. "hft-myd-czu5ev-v2:"
MACHINE_FEATURES:append = " mali400 vcu openamp fpga-overlay"

# Enabling the R5 multiconfig requires an MYIR-generated SDT/XSA machine.
HFT_ENABLE_R5_MULTICONFIG ?= "0"
BBMULTICONFIG += "${@'hft-myd-czu5ev-v2-cortexr5-0-freertos' if d.getVar('HFT_ENABLE_R5_MULTICONFIG') == '1' else ''}"

KERNEL_DEVICETREE:append = " hft-myd-czu5ev-v2-overlay.dtbo"
IMAGE_FSTYPES:append = " wic wic.bmap"
WKS_FILE = "hft-myd-czu5ev-v2-ab.wks.in"

HFT_R5_FIRMWARE ?= "hft-r5.elf"
HFT_PL_BITSTREAM ?= "myd_czu5ev_v2_hft.bit"
HFT_HARDWARE_VALIDATED ?= "0"

UBOOT_ENV:append = " boot_slot upgrade_available bootcount bootlimit"
KERNEL_MODULE_AUTOLOAD:append = " zynqmp_r5_remoteproc rpmsg_char"

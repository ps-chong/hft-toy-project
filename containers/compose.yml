services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hft
      POSTGRES_USER: hft
      POSTGRES_PASSWORD: hft-development-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hft"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - hft-postgres:/var/lib/postgresql/data

  exchange:
    build:
      context: ..
      dockerfile: containers/host/Dockerfile
    command:
      - python
      - -m
      - hft_tools.exchange_sim
      - --itch-bind
      - 0.0.0.0:9000
      - --ouch-bind
      - 0.0.0.0:9001
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace/python/src
    volumes:
      - ..:/workspace:ro
    ports:
      - "127.0.0.1:9000:9000/udp"
      - "127.0.0.1:9001:9001"

volumes:
  hft-postgres:
